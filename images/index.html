<!-- Activity 7: Contact Form Section -->
  <section id="contact" class="section">
    <h2>Contact Me</h2>
    <p>May tanong ka ba o gustong makipag-collaborate? Mag-iwan ng mensahe sa ibaba!</p>
    
    <form class="contact-form" action="#" method="POST">
      <div class="form-group">
        <label for="name">Pangalan</label>
        <input type="text" id="name" name="name" placeholder="Ipasok ang iyong pangalan" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Ipasok ang iyong email" required>
      </div>

      <div class="form-group">
        <label for="subject">Paksa (Subject)</label>
        <input type="text" id="subject" name="subject" placeholder="Paksa ng mensahe" required>
      </div>

      <div class="form-group">
        <label for="message">Mensahe</label>
        <textarea id="message" name="message" rows="5" placeholder="Isulat ang iyong mensahe rito..." required></textarea>
      </div>

      <button type="submit" class="btn-submit">Ipadala ang Mensahe</button>
    </form>
  </section>
